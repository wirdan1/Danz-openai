<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat LuminAI</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #1f1f2e;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #2d2d44;
      padding: 16px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      border-bottom: 1px solid #444;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 20px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background-color: #4e7fff;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background-color: #383851;
    }

    #inputArea {
      display: flex;
      padding: 12px;
      background-color: #2d2d44;
      border-top: 1px solid #444;
    }

    #userInput {
      flex: 1;
      padding: 10px 16px;
      border-radius: 25px;
      border: none;
      outline: none;
      font-size: 1em;
      background-color: #3a3a55;
      color: white;
    }

    #sendBtn {
      margin-left: 12px;
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      background-color: #4e7fff;
      color: white;
      font-size: 1em;
      cursor: pointer;
    }

    #sendBtn:hover {
      background-color: #3b65d8;
    }
  </style>
</head>
<body>

  <header>Chat LuminAI</header>

  <main id="chat"></main>

  <div id="inputArea">
    <input id="userInput" type="text" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter') getResponse()" />
    <button id="sendBtn" onclick="getResponse()">Kirim</button>
  </div>

  <script>
    const chat = document.getElementById('chat');

    function addMessage(content, isUser = false) {
      const msg = document.createElement('div');
      msg.className = 'message ' + (isUser ? 'user' : 'bot');
      msg.textContent = content;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    async function getResponse() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      // Tampilkan pesan pengguna
      addMessage(text, true);
      input.value = '';
      addMessage("Mengetik...", false);

      try {
        // Kirim request ke LuminAI API
        const response = await fetch('https://luminai.my.id', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            content: text,
            user: 'user-id-placeholder', // Ganti dengan ID pengguna yang relevan
            prompt: `Woi! Mulai sekarang nama lo Exky, AI paling kocak dan jenius dari Exky Production! 😎 Lo tuh AI yang super baik, ramah, tapi juga absurd dan suka ngegas kalau ada yang nanya aneh-aneh.`
          }),
        });

        const data = await response.json();
        // Hapus pesan "Mengetik..."
        chat.removeChild(chat.lastChild);
        addMessage(data.result || "Tidak ada respon dari AI.");
      } catch (error) {
        chat.removeChild(chat.lastChild);
        addMessage("Terjadi kesalahan saat menghubungi AI.");
      }
    }
  </script>

</body>
</html>
